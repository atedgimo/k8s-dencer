USER-SUPPLIED VALUES:
auth:
  enabled: true
database:
  postgres:
    database: dencer
    existingSecret: play-db
    host: play-postgres
    sslMode: disable
    user: dencer
  type: postgres
executor:
  enabled: true
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-executor
    tag: 0.8.1
persistence:
  enabled: false
  storageClass: standard-rwo
planner:
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-planner
    tag: 0.8.1
  minNodeAge: 30s
  usageSource: metrics-server
safety:
  maxNodesPerRun: 3
  minReadyNodes: 3
uiBackend:
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-ui-backend
    tag: 0.8.1
  pricing:
    currency: USD
    perHour:
      e2-medium: "0.03400"
      e2-medium/spot: "0.01133"
  replicaCount: 2
uiFrontend:
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-ui-frontend
    tag: 0.8.1
