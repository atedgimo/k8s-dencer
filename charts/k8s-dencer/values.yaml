# Default values for k8s-dencer.
#
# These defaults are vendor-neutral and must stay installable on any conformant
# cluster (EKS/GKE/AKS/on-prem). Local-development concerns belong in an
# overlay under ci/, never here. `make lint` enforces this.

nameOverride: ""
fullnameOverride: ""

# Applied to every pod in the release.
imagePullSecrets: []
commonLabels: {}
commonAnnotations: {}

serviceAccount:
  create: true
  # Defaults to the fullname when empty.
  name: ""
  # EKS IRSA / GKE Workload Identity annotations go here.
  annotations: {}

rbac:
  # Creates the cluster-scoped read-only role the planner needs to observe
  # nodes, pods and PDBs. Disable only if you manage RBAC out of band.
  create: true

# Plan Store backend.
database:
  # sqlite | postgres
  #
  # postgres is declared for Phase 2 and is NOT implemented yet; selecting it
  # is rejected by values.schema.json. sqlite is single-writer, which is why
  # uiBackend is pinned to one replica with a Recreate strategy.
  type: sqlite
  sqlite:
    path: /data/dencer.db
  postgres:
    host: ""
    port: 5432
    database: dencer
    user: dencer
    existingSecret: ""
    existingSecretPasswordKey: password
    sslMode: require

# PersistentVolumeClaim backing the SQLite plan store.
persistence:
  enabled: true
  # Bind an existing claim instead of creating one.
  existingClaim: ""
  # Empty inherits the cluster's default StorageClass. Never hardcode one.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# Pod-level security context, applied to all components. Defaults satisfy the
# restricted Pod Security Standard without modification.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level security context for the Go components.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

planner:
  replicaCount: 1
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-planner
    # Defaults to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  logLevel: info
  # How often the planner recomputes and informers relist.
  resyncPeriod: 30s
  # Where actual usage comes from. "" disables usage collection (the default:
  # plans never needed it — scheduling is requests-based); "metrics-server"
  # reads the metrics.k8s.io API and lights up the right-sizing report. If
  # metrics-server is missing or broken the planner degrades to "no data"
  # rather than erroring.
  usageSource: ""
  healthPort: 8081
  # Namespaces the pod, PDB and ReplicaSet informers watch. Empty watches all.
  #
  # The cluster-wide pod informer is the planner's dominant memory cost, so on
  # a large cluster this is the first knob to reach for. Nodes stay
  # cluster-scoped regardless: restricting them would leave the planner with
  # workloads and nowhere to place them.
  watchNamespaces: []

  # Consolidation policy inputs. These become the ConsolidationPolicy CRD in a
  # later milestone; they are values for now so the planner is tunable today.
  #
  # minNodeAge skips recently created nodes: a node that appeared moments ago
  # is probably a deliberate scale-up, and draining it immediately would fight
  # the autoscaler.
  minNodeAge: 10m
  # Cap on plan length. 0 means unlimited.
  maxSteps: 0
  # Destination utilisation the planner will not pack above, as a fraction of
  # allocatable CPU and memory. Nothing sane packs production nodes to 100%:
  # zero headroom absorbs no burst, no failed neighbour, no rollout surge.
  # 0 disables the ceiling.
  packCeiling: 0.85
  # Pods in these namespaces are treated as immovable, which makes their nodes
  # undrainable.
  excludeNamespaces: []

  # Impact-rating thresholds. Doc §10 is explicit that where PDB headroom stops
  # being acceptable differs per cluster, so these are tunable rather than
  # baked in. Defaults are deliberately cautious: an operator who finds them
  # noisy can loosen them, but one surprised by an outage they were told was
  # Green will not trust the tool again.
  impact:
    # Pods moved in a single step, at or above which the step is Yellow.
    yellowPodsMoved: 5
    # Pods moved in a single step, at or above which the step is Red.
    redPodsMoved: 15
    # PDB disruption headroom at or below which a covering PDB makes a step
    # Yellow. Zero headroom is always Red regardless of this value.
    tightPDBHeadroom: 1

  # How many plan versions to keep. Plan history is an audit trail, but the
  # volume is a fixed size; identical plans are deduplicated on their content
  # hash, so this counts distinct plans rather than planning cycles.
  retainPlans: 200
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # Single-replica by design; a PDB here would either be a no-op or make the
  # pod undrainable. See podDisruptionBudget below.
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

# Scheduling priority for the co-scheduled pair.
#
# SQLite pins the planner to the ui-backend's node (one RWO volume, one
# writer), so the planner has exactly one node it may occupy. On a packed
# cluster it loses to whatever got there first, and a planner that cannot
# schedule is a product that cannot plan.
#
# Created only when that constraint applies — an install on Postgres has no
# co-location and gets no cluster-scoped object it did not ask for.
#
# preemptionPolicy is Never by default: winning a scheduling queue is worth
# having, evicting somebody else's workload to do it is not. Set it to
# PreemptLowerPriority only if you mean it.
priorityClass:
  create: true
  # Deliberately below the 2000000000 of system-cluster-critical: this is
  # important to the product, not to the cluster.
  value: 1000000
  preemptionPolicy: Never

uiBackend:
  # Pinned to 1 while database.type is sqlite. Enforced by values.schema.json.
  replicaCount: 1

  # Shown in the UI header so an operator can see which cluster they are about
  # to act on. Empty renders nothing — a guessed environment name is worse than
  # none, because the entire value of this field is being believed when it says
  # "prod".
  #
  #   clusterLabel: prod-eu-west-1
  clusterLabel: ""

  # What your machines cost, so the savings ledger can be shown in money.
  #
  # There is no built-in price table and there will not be one. List prices
  # vary by region, change without notice, and are wrong for anyone with a
  # committed-use discount or an enterprise agreement — so a shipped default
  # would be a plausible guess wearing the clothes of a measurement, which is
  # the one thing this ledger exists not to be.
  #
  # Unpriced machine types are reported as unpriced. The capacity is still
  # measured and still shown; only the currency is withheld.
  #
  # Keys are matched most specific first, so a spot node and an on-demand node
  # of the same shape can differ:
  #
  #   pricing:
  #     currency: USD
  #     perHour:
  #       e2-medium: 0.0335
  #       e2-medium/spot: 0.0100
  #       n2-standard-4: 0.1942
  pricing:
    currency: ""
    perHour: {}

  # How often to check the store for a new plan, to push over the event stream.
  # The planner is a separate process reached only through the shared volume,
  # so there is no event feed to subscribe to.
  pollInterval: 5s
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-ui-backend
    tag: ""
    pullPolicy: IfNotPresent
  logLevel: info
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: false
    maxUnavailable: 1

uiFrontend:
  # The web UI is optional: a CLI-only install sets this false and keeps
  # planner + ui-backend (the API the CLI talks to). Ingress and httpRoute
  # both point at the frontend, so leave them disabled when this is off.
  enabled: true
  replicaCount: 2
  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-ui-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  # Injected into the browser at runtime via ConfigMap, so one image works
  # against any backend. Empty apiBaseUrl means same-origin through nginx.
  config:
    apiBaseUrl: ""
    # Deep link to the Kagent chat UI; empty hides the header link.
    kagentUrl: ""
  # nginx-unprivileged runs as uid 101 and cannot use the Go components'
  # 65532, so the frontend overrides the shared pod security context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    privileged: false
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  # maxUnavailable rather than minAvailable: a PDB that cannot be satisfied is
  # precisely the pathology this product exists to find, so ours must never
  # block a node drain.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: k8s-dencer.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API exposure, beside (not instead of) the Ingress — enable whichever
# your cluster standardises on, or both during a migration. The chart does NOT
# create a Gateway: that is cluster infrastructure with its own owner and TLS
# story. parentRefs names the Gateway this route attaches to, and the schema
# requires at least one so an enabled route cannot dangle. Needs the Gateway
# API CRDs (gateway.networking.k8s.io/v1).
httpRoute:
  enabled: false
  annotations: {}
  # - name: my-gateway
  #   namespace: infra
  #   sectionName: https
  parentRefs: []
  # - k8s-dencer.example.com
  hostnames: []

# The executor: the only component that can change your cluster.
#
# OFF by default, and an upgrade must never silently turn it on. Enabling it
# creates a ServiceAccount holding pods/eviction and adds a POST route to
# ui-backend — neither of which anyone should acquire by taking a chart bump.
#
# Even enabled, nothing runs without a person asking. The executor performs
# only the steps named in a request that passed a SubjectAccessReview, and the
# Safety Guard (see `safety` below) re-checks every one against live cluster
# state before touching anything.
#
# Requires auth.enabled and persistence.enabled; values.schema.json rejects
# either combination.
executor:
  enabled: false

  image:
    registry: ghcr.io
    repository: atedgimo/k8s-dencer-executor
    # Defaults to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent

  logLevel: info

  # Probes only. The executor serves no API — work arrives through the shared
  # plan store, so it has no inbound network surface.
  probePort: 8081

  # How a replacement pod is judged recovered before the run moves on.
  #
  #   Ready    the pod's Ready condition — it is actually serving
  #   Running  the phase only
  #
  # Ready is correct on a real cluster: a pod can be Running and failing its
  # probes, and calling that recovered drains the next node while the service
  # is still down.
  #
  # Running exists for KWOK, whose fake pods reach Running and never become
  # Ready, so a strict wait would hang forever. Only the local POC overlay
  # sets it; do not set it on a real cluster.
  readiness: Ready

  # How long one step may take end to end before it aborts and uncordons.
  stepTimeout: 10m
  # How long to wait for evicted pods to be replaced elsewhere before giving up
  # on a step. Raise it for workloads with slow startup.
  settleTimeout: 5m
  # How often to look for queued work.
  queuePollInterval: 3s
  # How often cluster state is re-read while a drain is in progress. Every
  # safety decision is made against a read this fresh.
  clusterPollInterval: 2s

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  # Left empty to inherit the co-scheduling the SQLite volume requires.
  affinity: {}
  priorityClassName: ""
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# The non-negotiable rails on execution (architecture doc §9).
#
# Enforced in code by internal/safety, checked before every step and before
# every individual eviction against freshly-read state — not by API input
# validation, so no crafted request can bypass them.
#
# Note what is NOT configurable: Red-rated steps are refused outright. They are
# confined to approved maintenance windows, which do not exist until Phase 3,
# and exposing that as a value would turn a safety rail into a footgun.
safety:
  # Most nodes one execution request may drain. Reached mid-run, the run stops
  # cleanly with the steps so far completed.
  maxNodesPerRun: 5
  # Schedulable nodes to leave behind, so a consolidation cannot squeeze the
  # cluster to the point where the next failure has nowhere to go.
  minReadyNodes: 3

networkPolicy:
  # Restricts ui-backend ingress to the frontend and (when enabled) Kagent.
  #
  # On by default. The policy is ingress-only: egress to the API server cannot
  # be expressed portably (it needs an ipBlock for the endpoint, or a
  # cluster-wide CIDR), and restricting inbound traffic is where the value is.
  #
  # Harmless on clusters whose CNI does not enforce NetworkPolicy — the object
  # is simply inert. Worth knowing, though, because it means this being on is
  # not proof that anything is being enforced.
  enabled: true
  # Extra selectors allowed to reach ui-backend, e.g. a Prometheus namespace.
  extraIngressFrom: []

# Authentication and authorization for the API.
#
# k8s-dencer owns no credential store. A caller presents a token, ui-backend
# validates it with a TokenReview, and permission is decided by a
# SubjectAccessReview — so "who may see the plan" and "who may drain a node"
# are ordinary RoleBindings that compose with whatever your cluster already
# uses.
#
# The chart ships two unbound ClusterRoles to bind:
#   <release>-viewer                  — may read plans
#   <release>-consolidation-operator  — may read plans and execute steps
auth:
  # On by default. This service reports where a cluster's spare capacity is,
  # and from the next release it accepts execution requests.
  enabled: true

  # Permit unauthenticated GETs. Never covers execution, whatever this is set
  # to. Reasonable behind a trusted network boundary; not a good default.
  anonymousRead: false

  # Restricts acceptable token audiences. Empty means the API server's own,
  # which is usually right: for an OIDC ID token the audience is the client ID
  # the API server was configured with, so the check is already being made by
  # the party best placed to make it.
  audiences: []

  # Single sign-on.
  #
  # When your API server runs with --oidc-issuer-url, an ID token from that
  # issuer is ALREADY a Kubernetes credential — the TokenReview above will
  # validate it and return the user's IdP groups. So SSO costs a redirect flow
  # in the browser and nothing on the server: no session store, no user
  # database, no client secret.
  #
  # Set issuerUrl to the SAME issuer the API server trusts. A different one
  # will authenticate the user in the browser and then be rejected here, which
  # is a confusing way to fail.
  #
  # Unavailable on clusters whose API server cannot validate a third-party
  # token (EKS with IAM auth, GKE with Google auth) — use trustedProxy there.
  oidc:
    enabled: false
    issuerUrl: ""
    # A public client using Authorization Code + PKCE. There is no secret,
    # because a secret shipped to a browser is not a secret.
    clientId: ""
    scopes:
      - openid
      - profile
      - email
      - groups

  # Accept an identity asserted by an upstream auth proxy (oauth2-proxy,
  # Ingress auth, a service mesh) instead of validating a token.
  #
  # OFF, and while it is off these headers are IGNORED — a request carrying
  # them is anonymous, not trusted. Turning it on means anything that can reach
  # ui-backend can claim to be anyone, so it is only as strong as the network
  # path: keep networkPolicy.enabled on and make sure the proxy cannot be
  # bypassed.
  trustedProxy:
    enabled: false
    userHeader: X-Forwarded-User
    groupsHeader: X-Forwarded-Groups

  # Require a token on the MCP endpoint the Kagent agent calls.
  #
  # Verified working against Kagent 0.9.12: set kagent.authSecret and the agent
  # presents a bearer token via RemoteMCPServer's headersFrom.
  #
  # Off only because turning it on needs a secret you create and rotate — see
  # kagent.authSecret. Turn it on if you can: many CNIs (k3s's default among
  # them) accept NetworkPolicy objects without enforcing them, and where that
  # is true this token is the ONLY control on the endpoint.
  #
  # The surface is read-only either way — four read tools, and a test fails if
  # a fifth ever appears.
  mcpRequireToken: false

# Observability. Every component serves Prometheus metrics on its existing HTTP
# port at a fixed path — see telemetry.MetricsPath in the Go source, which
# hack/lint-chart.sh asserts is the same string used below. A monitor pointing
# at a path the code does not serve is worse than no monitor: it reports a
# healthy scrape target that returns 404s.
serviceMonitor:
  # Scrapes ui-backend, the only component with a Service.
  # Requires the Prometheus Operator CRDs.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

podMonitor:
  # Scrapes planner and executor.
  #
  # A PodMonitor rather than a Service, deliberately. The privilege split holds
  # that the component reachable over the network cannot evict, and the one
  # that can evict has no Service at all. Giving the executor a Service so
  # Prometheus could find it would trade that property for a scrape target;
  # a PodMonitor addresses pods directly and costs nothing.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# Namespace Prometheus runs in.
#
# Load-bearing when networkPolicy.enabled and serviceMonitor.enabled are both
# on: the ui-backend policy admits only the frontend and Kagent, so without
# this the scrape is dropped at the network layer and the target simply reads
# as down. Ignored when either is off.
monitoringNamespace: monitoring

# Kagent integration. Off by default so the chart installs on clusters that do
# not have the kagent.dev CRDs.
kagent:
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  modelConfig: default-model-config
  runtime: python
  # Tools exposed to the agent. Read-only by construction: the MVP has no
  # executor, so there is nothing mutating to expose.
  toolNames:
    - list_plan_steps
    - explain_step
    - get_node_constraints
    - why_not_drained

  # Bearer token for the MCP endpoint, when auth.mcpRequireToken is on.
  #
  # Kagent's RemoteMCPServer supports headersFrom, so the agent can present a
  # credential — but the secret is yours to create and rotate. The chart will
  # not mint it, because the only way to do that declaratively is a
  # non-expiring ServiceAccount token Secret, and a permanent credential is a
  # poor default. The README has a TokenRequest recipe.
  #
  # The value must be the ENTIRE header, "Bearer eyJ...", not just the token:
  # Kagent substitutes it verbatim.
  #
  # Worth reading if you rely on networkPolicy instead: many CNIs (k3s's
  # default among them) accept NetworkPolicy objects without enforcing them,
  # in which case this token is the only real control on the endpoint.
  authSecret: {}
  #  name: dencer-mcp-token
  #  key: authorization
