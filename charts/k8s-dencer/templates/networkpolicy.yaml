{{- if .Values.networkPolicy.enabled }}
{{/*
Restricts who may reach ui-backend. The frontend always may; Kagent may when
the integration is on, since the agent calls the MCP endpoint directly, and
Prometheus may when serviceMonitor is on. Anything else must be listed in
networkPolicy.extraIngressFrom.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-ui-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "ui-backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-dencer.componentSelectorLabels" (dict "ctx" . "component" "ui-backend") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "k8s-dencer.componentSelectorLabels" (dict "ctx" . "component" "ui-frontend") | nindent 14 }}
        {{- if .Values.kagent.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "k8s-dencer.kagentNamespace" . }}
        {{- end }}
        {{- if .Values.serviceMonitor.enabled }}
        {{/*
        Prometheus must be admitted explicitly or the scrape is dropped here
        and the target reads as down, with nothing in the chart to explain why.
        */}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
        {{- end }}
        {{- with .Values.networkPolicy.extraIngressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.uiBackend.service.port }}
{{- end }}
