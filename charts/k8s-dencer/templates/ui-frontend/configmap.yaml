apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-ui-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "ui-frontend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Injected into the browser at pod start. Keeping the API endpoint out of the
  # bundle is what lets one image serve any cluster.
  config.js: |
    window.__DENCER_CONFIG__ = {
      apiBaseUrl: {{ .Values.uiFrontend.config.apiBaseUrl | quote }},
      kagentUrl: {{ .Values.uiFrontend.config.kagentUrl | quote }}
    };

  # Supplied as a ConfigMap rather than the image's envsubst entrypoint, which
  # would need to write into /etc/nginx/conf.d — forbidden by
  # readOnlyRootFilesystem.
  default.conf: |
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers on every response. A console that holds a bearer token
        # in the tab must not be frameable, and its responses must never be
        # MIME-sniffed into something executable. The CSP names exactly what the
        # bundle uses: self-hosted assets, data: for inlined images, and inline
        # style ATTRIBUTES (React style={}), which style-src cannot allow more
        # narrowly than 'unsafe-inline'.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

        location = /config.js {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass {{ include "k8s-dencer.uiBackendURL" . }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The plan view streams over a WebSocket from M6.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The entry HTML must revalidate on every load: without a
        # Cache-Control it is heuristically cached, and because it names the
        # hashed asset files a stale copy pins the browser to the previous
        # release with no sign that a deploy happened.
        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
