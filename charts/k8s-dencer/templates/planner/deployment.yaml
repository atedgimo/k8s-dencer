apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-planner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "planner") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.planner.replicaCount }}
  # The planner is a singleton writer; Recreate avoids two of them racing on
  # the plan store during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "k8s-dencer.componentSelectorLabels" (dict "ctx" . "component" "planner") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "planner") | nindent 8 }}
        {{- with .Values.planner.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (merge (dict) .Values.planner.podAnnotations .Values.commonAnnotations) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-dencer.componentServiceAccountName" (dict "component" "planner" "ctx" .) }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.planner.priorityClassName }}
      priorityClassName: {{ .Values.planner.priorityClassName }}
      {{- else if and .Values.priorityClass.create .Values.persistence.enabled (eq .Values.database.type "sqlite") }}
      # Co-scheduled with the other half of the SQLite volume, so it
      # cannot be placed elsewhere under pressure. An explicit
      # priorityClassName above always wins.
      priorityClassName: {{ include "k8s-dencer.fullname" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: planner
          image: {{ include "k8s-dencer.image" (dict "image" .Values.planner.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.planner.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.planner.logLevel | quote }}
            - name: RESYNC_PERIOD
              value: {{ .Values.planner.resyncPeriod | quote }}
            - name: HEALTH_ADDR
              value: ":{{ .Values.planner.healthPort }}"
            {{- with .Values.planner.watchNamespaces }}
            - name: WATCH_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: MIN_NODE_AGE
              value: {{ .Values.planner.minNodeAge | quote }}
            - name: MAX_STEPS
              value: {{ .Values.planner.maxSteps | quote }}
            - name: PACK_CEILING
              value: {{ .Values.planner.packCeiling | quote }}
            {{- with .Values.planner.excludeNamespaces }}
            - name: EXCLUDE_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: YELLOW_PODS_MOVED
              value: {{ .Values.planner.impact.yellowPodsMoved | quote }}
            - name: RED_PODS_MOVED
              value: {{ .Values.planner.impact.redPodsMoved | quote }}
            - name: TIGHT_PDB_HEADROOM
              value: {{ .Values.planner.impact.tightPDBHeadroom | quote }}
            - name: USAGE_SOURCE
              value: {{ .Values.planner.usageSource | quote }}
            - name: RETAIN_PLANS
              value: {{ .Values.planner.retainPlans | quote }}
            {{- include "k8s-dencer.databaseEnv" . | nindent 12 }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- /*
              The cluster's own label, read from uiBackend.clusterLabel rather
              than duplicated here. It is one fact about the cluster, and two
              places to set it is two places to set it differently -- a
              notification that says "prod" about staging is worse than one
              that says nothing.
            */}}
            {{- with .Values.uiBackend.clusterLabel }}
            - name: CLUSTER_LABEL
              value: {{ . | quote }}
            {{- end }}
            {{- if (.Values.planner.notify).existingSecret }}
            - name: NOTIFY_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.planner.notify).existingSecret }}
                  key: {{ (.Values.planner.notify).secretKey | default "url" }}
            {{- else if (.Values.planner.notify).url }}
            - name: NOTIFY_WEBHOOK_URL
              value: {{ (.Values.planner.notify).url | quote }}
            {{- end }}
            {{- with (.Values.planner.notify).linkUrl }}
            - name: NOTIFY_LINK_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.planner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.planner.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: health
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.planner.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so anything needing scratch space
            # must be an explicit volume.
            - name: tmp
              mountPath: /tmp
            {{- include "k8s-dencer.postgresCAMount" . | nindent 12 }}
            {{- if include "k8s-dencer.mountsDataVolume" . }}
            - name: data
              mountPath: {{ dir .Values.database.sqlite.path }}
            {{- end }}
            {{- with .Values.planner.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "k8s-dencer.postgresCAVolume" . | nindent 8 }}
        {{- if include "k8s-dencer.mountsDataVolume" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "k8s-dencer.pvcName" . }}
          {{- else }}
          # Not durable: plan history is lost on restart. Acceptable only for
          # ephemeral test installs.
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.planner.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.planner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.planner.affinity }}
      affinity:
        {{- toYaml .Values.planner.affinity | nindent 8 }}
      {{- else if and .Values.persistence.enabled (eq .Values.database.type "sqlite") }}
      # SQLite lives on a ReadWriteOnce claim that both the planner and the
      # ui-backend open. RWO permits multiple pods only on the same node, so
      # they must be co-scheduled. This constraint disappears once
      # database.type is postgres. Override planner.affinity to opt out.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "k8s-dencer.componentSelectorLabels" (dict "ctx" . "component" "ui-backend") | nindent 18 }}
      {{- end }}
