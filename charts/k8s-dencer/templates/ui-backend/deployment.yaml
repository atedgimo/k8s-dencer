apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-ui-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "ui-backend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.uiBackend.replicaCount }}
  strategy:
    {{- if eq .Values.database.type "sqlite" }}
    # SQLite is a single-writer store on a ReadWriteOnce claim: a rolling
    # update would briefly run two writers against one file.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "k8s-dencer.componentSelectorLabels" (dict "ctx" . "component" "ui-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "ui-backend") | nindent 8 }}
        {{- with .Values.uiBackend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with (merge (dict) .Values.uiBackend.podAnnotations .Values.commonAnnotations) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-dencer.componentServiceAccountName" (dict "component" "ui-backend" "ctx" .) }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiBackend.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ui-backend
          image: {{ include "k8s-dencer.image" (dict "image" .Values.uiBackend.image "ctx" .) | quote }}
          imagePullPolicy: {{ .Values.uiBackend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.uiBackend.logLevel | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.uiBackend.service.port }}"
            - name: DATABASE_TYPE
              value: {{ .Values.database.type | quote }}
            {{- if eq .Values.database.type "sqlite" }}
            - name: DATABASE_PATH
              value: {{ .Values.database.sqlite.path | quote }}
            {{- else }}
            - name: POSTGRES_HOST
              value: {{ .Values.database.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.database.postgres.port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.database.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.postgres.user | quote }}
            - name: POSTGRES_SSLMODE
              value: {{ .Values.database.postgres.sslMode | quote }}
            {{- with .Values.database.postgres.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.database.postgres.existingSecretPasswordKey }}
            {{- end }}
            {{- end }}
            - name: POLL_INTERVAL
              value: {{ .Values.uiBackend.pollInterval | quote }}
            # POD_NAMESPACE is already declared below; it also scopes the
            # SubjectAccessReview, so permission can be granted with a
            # RoleBinding in this namespace rather than a cluster-wide one.
            # Adds POST /api/v1/plans/{id}/execute. Without an executor to
            # claim the work there is no route at all, rather than one that
            # queues requests nothing will ever perform.
            - name: EXECUTOR_ENABLED
              value: {{ .Values.executor.enabled | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: AUTH_ANONYMOUS_READ
              value: {{ .Values.auth.anonymousRead | quote }}
            - name: AUTH_MCP_REQUIRE_TOKEN
              value: {{ .Values.auth.mcpRequireToken | quote }}
            {{- with .Values.auth.audiences }}
            - name: AUTH_AUDIENCES
              value: {{ join "," . | quote }}
            {{- end }}
            # Named in 403 responses so a denial can quote the command that
            # grants the permission.
            - name: AUTH_OPERATOR_ROLE
              value: {{ include "k8s-dencer.fullname" . }}-consolidation-operator
            - name: AUTH_OIDC_ENABLED
              value: {{ .Values.auth.oidc.enabled | quote }}
            {{- if .Values.auth.oidc.enabled }}
            - name: AUTH_OIDC_ISSUER_URL
              value: {{ .Values.auth.oidc.issuerUrl | quote }}
            - name: AUTH_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            {{- with .Values.auth.oidc.scopes }}
            - name: AUTH_OIDC_SCOPES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.trustedProxy.enabled }}
            - name: AUTH_TRUSTED_PROXY_ENABLED
              value: "true"
            - name: AUTH_TRUSTED_PROXY_USER_HEADER
              value: {{ .Values.auth.trustedProxy.userHeader | quote }}
            - name: AUTH_TRUSTED_PROXY_GROUPS_HEADER
              value: {{ .Values.auth.trustedProxy.groupsHeader | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.uiBackend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.uiBackend.service.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.uiBackend.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: {{ dir .Values.database.sqlite.path }}
            {{- with .Values.uiBackend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "k8s-dencer.pvcName" . }}
          {{- else }}
          # Not durable: plan history is lost on restart. Acceptable only for
          # ephemeral test installs.
          emptyDir: {}
          {{- end }}
        {{- with .Values.uiBackend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.uiBackend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiBackend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiBackend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uiBackend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
