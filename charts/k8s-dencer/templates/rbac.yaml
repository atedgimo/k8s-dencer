{{- if .Values.rbac.create }}
{{/*
Read-only, cluster-scoped. Phase 1 has no executor, so there is deliberately no
pods/eviction, no nodes patch (cordon), and no create/update/delete anywhere.
When the executor lands in Phase 2 it gets its OWN ServiceAccount and Role
rather than widening this one.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-read
  labels:
    {{- include "k8s-dencer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dencer.io"]
    resources:
      - maintenancewindows
    verbs: ["get", "list", "watch"]
  {{- if eq .Values.planner.usageSource "metrics-server" }}
  # Usage collection, opt-in: read-only access to the metrics.k8s.io
  # aggregated API. Off by default, and still nothing here can write.
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-read
  labels:
    {{- include "k8s-dencer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-dencer.fullname" . }}-read
subjects:
  {{- range $component := list "planner" "ui-backend" }}
  - kind: ServiceAccount
    name: {{ include "k8s-dencer.componentServiceAccountName" (dict "component" $component "ctx" $) }}
    namespace: {{ $.Release.Namespace }}
  {{- end }}
{{- if .Values.auth.enabled }}
---
{{/*
Lets ui-backend ask the API server "who is this?" (TokenReview) and "may they?"
(SubjectAccessReview). system:auth-delegator is the built-in role for exactly
this; every aggregated API server in the ecosystem uses it.

Neither verb grants anything. TokenReview validates a token that was already
issued, and SubjectAccessReview only reads an existing policy — which is why
delegating authentication is safe in a way that minting credentials would not be.

Bound to ui-backend alone. The planner never sees a request from a human.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-auth-delegator
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "ui-backend") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-dencer.componentServiceAccountName" (dict "component" "ui-backend" "ctx" .) }}
    namespace: {{ .Release.Namespace }}
---
{{/*
The permissions humans hold, shipped unbound.

dencer.io/plans and dencer.io/consolidations are not CRDs and never will be —
RBAC and SubjectAccessReview match on strings, so a permission can be granted
against a resource name that has no API behind it. metrics-server and the
Prometheus adapter rely on the same property.

Bind whichever of these you need to a user or, better, to an IdP group:

  kubectl create rolebinding dencer-viewer -n {{ .Release.Namespace }} \
    --clusterrole={{ include "k8s-dencer.fullname" . }}-viewer --group=oidc:platform-eng

Deliberately left unbound: the chart should not decide who may look at your
capacity, still less who may drain a node.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-viewer
  labels:
    {{- include "k8s-dencer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["dencer.io"]
    resources: ["plans"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-consolidation-operator
  labels:
    {{- include "k8s-dencer.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["dencer.io"]
    resources: ["plans"]
    verbs: ["get"]
  {{/*
  The permission to drain nodes. Nothing in this release accepts it yet — the
  executor arrives in M10 — but it is defined now so that when the first
  mutating route ships, the gate it sits behind is already deployed, already
  bound, and already tested. An execute endpoint and its permission must never
  be separated by a release.
  */}}
  - apiGroups: ["dencer.io"]
    resources: ["consolidations"]
    verbs: ["create"]
{{- end }}
{{- if .Values.executor.enabled }}
---
{{/*
The only grant of pods/eviction in this chart, on the only ServiceAccount that
is not attached to anything reachable from the network.

Read this list against internal/executor/cluster.go, which enumerates the four
operations the code can perform. They should match exactly:

  nodes  patch   -> cordon and uncordon, as a merge patch of spec.unschedulable
  pods/eviction  -> the policy/v1 eviction API, which is what makes the API
                    server enforce PodDisruptionBudgets

Note what is absent and must stay absent:

  - delete on pods. A delete bypasses PodDisruptionBudgets entirely. Eviction
    is the whole point; a delete verb here would silently defeat it.
  - update on nodes. patch carries one field, so a concurrent change by the
    cluster autoscaler or an operator with kubectl cannot be clobbered.
  - anything on secrets, configmaps, deployments, or scale subresources.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-executor
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "executor") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Read-only, and only to name a pod's real controller in the audit trail and
  # to verify a workload recovered after its pods moved.
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  # Maintenance windows are the only thing that can unlock a Red step, so the
  # executor must read them live. It writes only their status — never their
  # spec, so the component that benefits from a window cannot widen one.
  - apiGroups: ["dencer.io"]
    resources: ["maintenancewindows"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dencer.io"]
    resources: ["maintenancewindows/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-dencer.fullname" . }}-executor
  labels:
    {{- include "k8s-dencer.componentLabels" (dict "ctx" . "component" "executor") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-dencer.fullname" . }}-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-dencer.componentServiceAccountName" (dict "component" "executor" "ctx" .) }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
