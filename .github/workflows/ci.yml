# Every gate this repo relies on, run by a machine instead of by whoever
# remembered.
#
# Most of the project's safety story is "there is a test that fails if you
# break it": the palette guards that keep the risk scale colour-blind-safe, the
# ast check that no API route escapes authorization, the assertion that the
# executor alone holds pods/eviction, the transform test that the informer
# cache cannot drop a field the planner reads. None of those protected anything
# until this file existed, because nothing ran them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # So a scheduled run catches breakage from the outside world — a new
  # Kubernetes schema, a yanked dependency — rather than the next contributor.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest

    # The store speaks to SQLite or to Postgres, and the promise it makes is
    # that the two behave identically. A real server is the only thing that
    # can check that promise: the first time this store met one it failed
    # fourteen tests, thirteen from placeholders never rewritten and one from
    # a claim that let two executors take the same run — a double drain. None
    # of it was visible against SQLite.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dencer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        # -race because the planner, executor and HTTP servers all run
        # concurrently in production and the tests exercise that.
        run: go test -race -count=1 ./...

      - name: store tests against postgres
        # The same suite, not a second one: DENCER_TEST_POSTGRES redirects
        # openTemp, so every assertion already written runs again over the
        # other backend. A separate Postgres suite would only prove that the
        # tests someone remembered to write twice agree.
        env:
          DENCER_TEST_POSTGRES: postgres://postgres:test@localhost:5432/dencer?sslmode=disable
        run: go test -race -count=1 ./internal/store/...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^ui/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

  chart:
    name: chart contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5

      # hack/lint-chart.sh reads telemetry.MetricsPath out of the Go source and
      # asserts the rendered templates agree, so this job needs the whole repo,
      # not just charts/.
      - name: lint
        run: make lint

  ui:
    name: ui typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # Density mode reads optional fields; a field that stops arriving renders
      # as zero rather than failing, so the arithmetic is asserted directly.
      - run: npm run test:density
      - run: npm run test:trend
      # A build failure is a real failure: the frontend ships as a static
      # bundle, so anything tsc lets through still has to survive Vite.
      - run: npm run build

  e2e:
    name: e2e on a multi-node cluster (${{ matrix.backend }})
    runs-on: ubuntu-latest
    # Both plan stores, because the promise is that they behave identically and
    # for one release they did not: v0.6.0's Postgres backend could not record
    # a drain, and this job — SQLite-only at the time — was green throughout.
    # The same script either way; only the install and the storage assertions
    # differ, and those differ by being each other's opposites.
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    # The only job that installs anything. Everything else is unit tests,
    # rendered templates, or benchmarks over synthesised fixtures — none of
    # which evict a pod that is really running.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5

      # Installed directly rather than through a marketplace action. The one
      # tried first was pinned to a k3d release that no longer exists, and it
      # created a cluster of its own that hack/e2e.sh does not want — the
      # script builds and tears down its own. Pinned so a k3d release cannot
      # change what this job tests without a commit.
      - name: install k3d
        env:
          K3D_VERSION: v5.9.0
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG="$K3D_VERSION" bash
          k3d version

      - name: e2e
        env:
          BACKEND: ${{ matrix.backend }}
        run: ./hack/e2e.sh

  bench:
    name: benchmarks compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Not a performance gate. A shared runner's timings are far too noisy to
      # assert against, and a flaky red build teaches people to ignore CI.
      # What this catches is the benchmarks silently rotting — the numbers in
      # docs/benchmarks.md are load-bearing for Phase 4 decisions, and they are
      # worthless if nobody can reproduce them.
      - name: run benchmarks once
        run: go test ./internal/planner/ -run '^$' -bench . -benchtime 1x -timeout 20m
