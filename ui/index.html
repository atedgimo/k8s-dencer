<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>k8s-dencer</title>
    <!-- The 1a mark: a lowercase d whose bowl is a heptagon — seven sides
         and pod-dots read Kubernetes without reproducing anyone's logo.
         SVG-only on purpose: every modern browser takes it, and the mark's
         strokes are sized to survive 16px (see assets/brand/HANDOFF.md). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Runtime config, replaced by a ConfigMap mount in-cluster. Loaded
         before the bundle so window.__DENCER_CONFIG__ is always defined. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
