# Default server block baked into the image so `docker run` works standalone.
#
# In-cluster the chart mounts a ConfigMap over this file with the real backend
# Service name templated in. A ConfigMap is used rather than the image's
# envsubst entrypoint because that entrypoint writes into /etc/nginx/conf.d,
# which readOnlyRootFilesystem forbids.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. A console that holds a bearer token
    # in the tab must not be frameable, and its responses must never be
    # MIME-sniffed into something executable. The CSP names exactly what the
    # bundle uses: self-hosted assets, data: for inlined images, and inline
    # style ATTRIBUTES (React style={}), which style-src cannot allow more
    # narrowly than 'unsafe-inline'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    # Runtime config must never be cached: it is how a redeploy changes the
    # API endpoint without rebuilding the image.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://ui-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # Hashed assets are immutable; the entry HTML is not.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry HTML must revalidate on every load.
    #
    # Without this it carries no Cache-Control at all, so browsers fall back to
    # heuristic caching off Last-Modified and can serve a stale index.html for
    # hours. Because that document is what names the hashed asset files, a
    # stale copy pins the whole app to the previous release — a deploy lands,
    # the pod serves new bundles, and the operator's browser keeps rendering
    # the old one with no indication anything happened.
    #
    # no-cache permits caching but forces revalidation, so the common case is
    # still a cheap 304 rather than a re-download.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
